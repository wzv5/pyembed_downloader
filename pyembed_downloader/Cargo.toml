[package]
name = "pyembed_downloader"
version = "0.2.2"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.13.3", features = ["gzip", "brotli", "zstd", "deflate", "stream"] }
regex = "1.12.3"
bytes = "1.11.1"
md-5 = "0.11.0"
sha2 = "0.11.0"
base16ct = "1.0.0"
zip = "8.6.0"
log = "0.4.29"
futures-util = "0.3.32"

[dependencies.winapi]
version = "0.3.9"
features = [
    "winnt",
    "jobapi2",
    "minwindef",
    "processthreadsapi",
    "winuser",
    "wincon",
    "handleapi",
    "winbase"
]
