[package]
name = "pyembed_downloader_gui"
version = "0.2.2"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
regex = "1.12.3"
tokio = { version = "1.52.1", features = ["rt-multi-thread"] }
log = "0.4.29"
wfd = "0.1.8"
pyembed_downloader = { path = "../pyembed_downloader" }

[dependencies.winapi]
version = "0.3.9"
features = [
    "winuser",
    "libloaderapi",
    "commctrl",
    "shellapi",
    "windef",
    "basetsd",
    "shobjidl_core",
    "combaseapi",
    "unknwnbase",
    "impl-default"
]

[build-dependencies]
embed-resource = "3.0.9"
